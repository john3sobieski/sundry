[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/archive",
    "crates/tools-convert",
    "crates/tools-image",
    "crates/cli",
    "crates/app",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.93"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["john3sobieski"]
publish = false

[workspace.dependencies]
sundry-core = { path = "crates/core" }
sundry-archive = { path = "crates/archive" }
sundry-tools-convert = { path = "crates/tools-convert" }
sundry-tools-image = { path = "crates/tools-image" }
sundry-cli = { path = "crates/cli" }
fast_image_resize = "6.2"
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm", "qoi",
] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# `unstable-winit-030`: files dragged from the file manager arrive as winit events.
slint = { version = "1.18", features = ["unstable-winit-030"] }
slint-build = "1.18"
rfd = "0.17"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
