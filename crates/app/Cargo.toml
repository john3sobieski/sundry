[package]
name = "sundry-app"
description = "Slint desktop frontend for Sundry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "sundry-app"
path = "src/main.rs"

[dependencies]
sundry-core.workspace = true
sundry-cli.workspace = true
sundry-archive.workspace = true
sundry-tools-image.workspace = true
slint.workspace = true
tracing.workspace = true
rfd.workspace = true
sys-locale.workspace = true

[build-dependencies]
slint-build.workspace = true

# Not `workspace = true`: that forbids unsafe code, and `forbid` cannot be
# relaxed for the code generated by Slint.
[lints.rust]
unsafe_code = "deny"
